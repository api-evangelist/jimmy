aid: jimmy
name: Jimmy
description: >-
  Jimmy (Jimmy Energy SAS) is a French nuclear-technology company, founded in 2020 as a spin-off from
  the CEA, that designs, builds and operates small modular high-temperature reactors it calls thermal
  generators — helium-cooled HTR units the company describes as bus-sized — to deliver carbon-free
  process heat directly to industrial sites under secured 20-year supply-and-price contracts. Jimmy is
  headquartered in Paris with an industrial platform at Le Creusot in Burgundy, targets food, paper,
  sugar and chemicals producers that currently burn natural gas for process heat, and filed the first
  SMR creation-authorization request in France for a generator at the Cristanol site in Bazancourt.
  Jimmy sells heat, not software: it publishes no API, developer portal, SDK or machine-readable
  specification, and this profile records that measured absence rather than assuming it.
